<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harry Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0f172a;color:white;
  font-family:Arial,sans-serif;padding:20px
}
.container{max-width:850px;margin:35px auto}
.card{
  background:#1e293b;padding:22px;
  border-radius:14px;margin-bottom:20px
}
h1{color:#38bdf8}
input,textarea{
  width:100%;padding:13px;margin:8px 0;
  border:1px solid #475569;border-radius:8px;
  background:#0f172a;color:white
}
button{
  padding:12px 17px;border:0;border-radius:8px;
  background:#0284c7;color:white;
  cursor:pointer;margin:5px
}
.delete{background:#dc2626}
.edit{background:#16a34a}
.hidden{display:none}
.app{
  background:#334155;padding:15px;
  border-radius:10px;margin:12px 0
}
small{color:#cbd5e1}
</style>
</head>

<body>
<div class="container">

<div id="login" class="card">
<h1>Harry Admin</h1>
<p>Login to your dashboard</p>

<form id="loginForm">
<input id="email" type="email"
placeholder="Admin Email" required>

<input id="password" type="password"
placeholder="Password" required>

<button type="submit">Login</button>
</form>
<p id="loginMsg"></p>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h1>Harry Admin Dashboard</h1>
<p>Welcome, <b>harryadmin</b></p>
<h2>Total Apps: <span id="total">0</span></h2>
<button id="logout">Logout</button>
</div>

<div class="card">
<h2 id="formTitle">Add New App</h2>

<form id="appForm">
<input id="appName"
placeholder="App Name" required>

<textarea id="description"
placeholder="App Description"></textarea>

<input id="category"
placeholder="App Category">

<button type="submit">Save App</button>
<button type="button" id="cancelEdit"
class="hidden">Cancel Edit</button>
</form>

<p id="appMsg"></p>
</div>

<div class="card">
<h2>Manage Apps</h2>
<div id="appList">Loading apps...</div>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let editingId = null;

function message(id,text){
  $(id).textContent = text;
}

function showDashboard(){
  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
}

function showLogin(){
  $("dashboard").classList.add("hidden");
  $("login").classList.remove("hidden");
}

async function checkAdmin(){
  const {data:{session}} = await db.auth.getSession();

  if(!session){
    showLogin();
    return;
  }

  const {data,error} = await db.rpc("is_admin");

  if(error || data !== true){
    await db.auth.signOut();
    showLogin();
    message("loginMsg","Access denied: Admin only.");
    return;
  }

  showDashboard();
  loadApps();
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  message("loginMsg","Checking login...");

  const {error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  if(error){
    message("loginMsg",error.message);
    return;
  }

  await checkAdmin();
});

async function loadApps(){
  const {data,error} = await db
    .from("apps")
    .select("id,name,description,category")
    .order("id",{ascending:false});

  if(error){
    message("appList",error.message);
    return;
  }

  $("total").textContent = data.length;
  $("appList").replaceChildren();

  data.forEach(app=>{
    const box = document.createElement("div");
    box.className="app";

    const name = document.createElement("h3");
    name.textContent=app.name;

    const desc = document.createElement("p");
    desc.textContent=app.description || "";

    const cat = document.createElement("small");
    cat.textContent=app.category || "";

    const edit = document.createElement("button");
    edit.className="edit";
    edit.textContent="Edit";
    edit.onclick=()=>editApp(app);

    const del = document.createElement("button");
    del.className="delete";
    del.textContent="Delete";
    del.onclick=()=>deleteApp(app.id);

    box.append(name,desc,cat,document.createElement("br"),edit,del);
    $("appList").appendChild(box);
  });

  if(data.length===0){
    message("appList","No apps added yet.");
  }
}

$("appForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const app={
    name:$("appName").value.trim(),
    description:$("description").value.trim(),
    category:$("category").value.trim()
  };

  let result;

  if(editingId){
    result=await db.from("apps")
      .update(app).eq("id",editingId);
  }else{
    result=await db.from("apps").insert([app]);
  }

  if(result.error){
    message("appMsg",result.error.message);
    return;
  }

  message("appMsg","App saved successfully!");

  resetForm();
  loadApps();
});

function editApp(app){
  editingId=app.id;

  $("appName").value=app.name || "";
  $("description").value=app.description || "";
  $("category").value=app.category || "";

  $("formTitle").textContent="Edit App";
  $("cancelEdit").classList.remove("hidden");

  window.scrollTo(0,0);
}

async function deleteApp(id){
  if(!confirm("Are you sure you want to delete this app?"))return;

  const {error}=await db.from("apps")
    .delete().eq("id",id);

  if(error){
    message("appMsg",error.message);
    return;
  }

  message("appMsg","App deleted successfully!");
  loadApps();
}

function resetForm(){
  editingId=null;
  $("appForm").reset();
  $("formTitle").textContent="Add New App";
  $("cancelEdit").classList.add("hidden");
}

$("cancelEdit").onclick=resetForm;

$("logout").onclick=async()=>{
  await db.auth.signOut();
  showLogin();
};

checkAdmin();
</script>
</body>
  </html>
